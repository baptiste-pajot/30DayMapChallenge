<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet" />
  <title>Day 1 · Points — Spherical centroid</title>
  <link href="../utils/panel.css" rel="stylesheet" />
  <style>
    #map { position: absolute; inset: 0; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="panel">
    <h1>#30DayMapChallenge · Day 1: Points</h1>
    <p>Click the globe to add points. Click a point to remove it. The yellow marker is the
      <b>spherical centroid</b>: the mean of the points as 3D unit vectors, projected back onto the sphere.</p>
    <div class="legend">
      <span><span class="dot" style="background:#ff4d6d"></span>Points</span>
      <span><span class="dot" style="background:#ffc400"></span>Centroid</span>
    </div>
    <div class="buttons">
      <button id="random">+5 random</button>
      <button id="undo">Undo</button>
      <button id="clear">Clear</button>
    </div>
    <div id="centroid" class="info" style="--accent: #ffc400">Add points to compute the centroid.</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>Lat (°)</th><th>Lng (°)</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>


  <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
  <script src="../utils/config.js"></script>
  <script src="../utils/geo.js"></script>
  <script src="../utils/map.js"></script>
  <script src="centroid.js"></script>
  <script src="app.js"></script>
</body>
</html>
